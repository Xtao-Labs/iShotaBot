[project]
name = "ishotabot"
version = "0.1.0"
description = "ishotabot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "aiosqlite>=0.22.0",
    "apscheduler>=3.11.2",
    "asyncio>=4.0.0",
    "atproto>=0.0.73",
    "beautifulsoup4>=4.15.0",
    "bilibili-api-python>=17.4.2",
    "cashews>=7.6.0",
    "coloredlogs>=15.0.1",
    "httpx2>=2.16.0",
    "jinja2>=3.1.6",
    "lofter-py",
    "lottie>=0.7.2",
    "lxml>=6.0.2",
    "markdown>=3.11.3",
    "pillow>=13.0.0",
    "playwright==1.58.0",
    "pydantic>=2.14.1",
    "pyrogram",
    "pyrotgcrypto>=1.2.7",
    "pytz>=2026.3",
    "qrcode>=8.2",
    "setuptools>=84.0.0",
    "sqlalchemy>=2.0.41",
    "sqlmodel>=0.0.48",
]

[dependency-groups]
dev = [
    "pyrefly>=1.2.0",
    "ruff>=0.14.10",
]

[tool.uv.sources]
pyrogram = { git = "https://github.com/TeamPGM/pyrogram" }
lofter-py = { git = "https://github.com/Xtao-Labs/lofter.py" }
